<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>头颈三个主动输入组合运动｜模块连接副-等效旋转轴的灵敏度分析</title><link rel="stylesheet" href="site.css?v=20261105-blackbox-1"><script src="directional-friction.js?v=20261030-1"></script><script src="link-tolerance.js?v=20261030-1"></script><script src="link-length-controls.js?v=20261030-1"></script><script src="neck-3d-view.js?v=20261030-1"></script></head><body><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="index.html">模块连接副-等效旋转轴的灵敏度分析</a><nav class="site-nav" aria-label="模块导航"><a href="index.html">总览</a><a href="j2.html">腿足</a><a href="index.html#head-neck" aria-current="page">头颈</a><a href="torso-j0.html">躯干</a><a href="arm-j3.html">手臂</a></nav></div></header><nav class="joint-nav" aria-label="头颈等效旋转轴"><span>头颈</span><a class="joint-tab" href="neck-j0.html">J0</a><a class="joint-tab" href="neck-j1.html">J1</a><a class="joint-tab" href="neck-j2.html">J2</a><a class="joint-tab" href="neck-combined.html" aria-current="page">组合</a></nav><main class="model-shell"><section class="torso-page neck-blackbox-page" data-neck-combined>
  <header class="model-heading"><div><p class="eyebrow">头颈真实主动输入</p><h1>头颈三个主动输入组合运动</h1><p>Yaw、左推杆、右推杆为三个主动输入；Roll/Pitch 被动输出由非线性闭链自动求解。</p></div><div class="model-badge">Roll/Pitch 被动输出</div></header>
  <div class="torso-layout">
    <section class="panel"><div class="panel-heading"><div><h2>三维机构</h2><p>所有硬点随真实刚体和推杆闭链同步更新。</p></div><button class="button-secondary" data-neck-reset-view>复位视角</button></div><svg class="torso-svg neck-new-svg" data-neck-svg viewBox="0 0 720 540"></svg></section>
    <section class="panel torso-control-panel"><h2>三个主动输入</h2><label class="field-label">Yaw <output data-neck-yaw-value>0.0°</output><input data-neck-active-yaw type="range" min="-10" max="10" step="0.1" value="0"></label><label class="field-label">左推杆 <output data-neck-left-value>0.0 mm</output><input data-neck-active-left type="range" min="-4" max="4" step="0.01" value="0"></label><label class="field-label">右推杆 <output data-neck-right-value>0.0 mm</output><input data-neck-active-right type="range" min="-4" max="4" step="0.01" value="0"></label><div class="solve-state" data-neck-status>等待计算</div><dl class="torso-readout"><div><dt>Roll 被动输出</dt><dd data-neck-passive-roll>0.0000°</dd></div><div><dt>Pitch 被动输出</dt><dd data-neck-passive-pitch>0.0000°</dd></div><div><dt>闭链残差</dt><dd data-neck-residual>0.000000 mm</dd></div><div><dt>运动学分支</dt><dd data-neck-branch>—</dd></div></dl><div class="torso-presets"><button data-neck-preset="pitch">Pitch：+1 / +1 mm</button><button data-neck-preset="roll">Roll：+1 / −1 mm</button><button data-neck-preset="zero">归零</button></div></section>
  </div>
</section>
<script type="module">
import {createNeckRuntime} from './neck-runtime.mjs';
const data=await fetch('./data/neck/model.json').then(r=>r.json()),M=createNeckRuntime(data),root=document.querySelector('[data-neck-combined]'),camera=window.Neck3DView.createCamera({width:720,height:540,center:{x:-20,y:0,z:500},scale:2.5}),svg=root.querySelector('[data-neck-svg]'),yaw=root.querySelector('[data-neck-active-yaw]'),left=root.querySelector('[data-neck-active-left]'),right=root.querySelector('[data-neck-active-right]');let last=null,drag=null;
const P=a=>camera.project({x:a[0],y:a[1],z:a[2]}),line=(a,b,c)=>{const p=P(a),q=P(b);return`<line class="${c}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"></line>`};function draw(s){const k=M.kinematics(s),p=k.points;svg.innerHTML=line(p.leftLower,p.leftUpper,'neck-new-rod neck-left')+line(p.rightLower,p.rightUpper,'neck-new-rod neck-right')+line(p.roll,p.pitch,'neck-new-axis neck-roll-axis')+line(p.pitch,p.yaw,'neck-new-axis neck-pitch-axis')}
function update(){const s=M.solveInputs({yawDeg:Number(yaw.value),leftMm:Number(left.value),rightMm:Number(right.value)}),status=root.querySelector('[data-neck-status]');if(!s.complete){status.textContent='闭链未收敛｜'+s.error;status.dataset.state='error';return}last=s;draw(s);status.textContent=`闭链已收敛｜${s.iterations} 次迭代`;status.dataset.state='ok';root.querySelector('[data-neck-yaw-value]').textContent=s.yawDeg.toFixed(1)+'°';root.querySelector('[data-neck-left-value]').textContent=s.leftMm.toFixed(2)+' mm';root.querySelector('[data-neck-right-value]').textContent=s.rightMm.toFixed(2)+' mm';root.querySelector('[data-neck-passive-roll]').textContent=s.rollDeg.toFixed(4)+'°';root.querySelector('[data-neck-passive-pitch]').textContent=s.pitchDeg.toFixed(4)+'°';root.querySelector('[data-neck-residual]').textContent=s.residualMm.toExponential(3)+' mm';root.querySelector('[data-neck-branch]').textContent=s.branch}
[yaw,left,right].forEach(i=>i.addEventListener('input',update));root.querySelectorAll('[data-neck-preset]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.neckPreset;if(p==='pitch'){left.value=1;right.value=1}else if(p==='roll'){left.value=1;right.value=-1}else{yaw.value=0;left.value=0;right.value=0}update()}));svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;camera.rotate(e.clientX-drag.x,e.clientY-drag.y);drag={x:e.clientX,y:e.clientY};draw(last)});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('wheel',e=>{e.preventDefault();camera.zoom(e.deltaY<0?8:-8);draw(last)},{passive:false});root.querySelector('[data-neck-reset-view]').addEventListener('click',()=>{camera.reset();draw(last)});update();
</script>
</main><script>(()=>{const initialized=new WeakSet();window.initChartResizeControls=(root=document)=>{root.querySelectorAll('[data-chart-panel]').forEach(panel=>{if(initialized.has(panel))return;initialized.add(panel);const stage=panel.querySelector('[data-chart-stage]'),output=panel.querySelector('[data-chart-scale]');let scale=1;const apply=()=>{stage.style.width=(scale*100)+'%';output.textContent=Math.round(scale*100)+'%';panel.querySelector('[data-chart-action="out"]').disabled=scale<=.75;panel.querySelector('[data-chart-action="in"]').disabled=scale>=2};panel.addEventListener('click',event=>{const button=event.target.closest('[data-chart-action]');if(!button)return;const action=button.dataset.chartAction;if(action==='out')scale=Math.max(.75,scale-.25);if(action==='in')scale=Math.min(2,scale+.25);if(action==='reset')scale=1;if(action==='fullscreen'){if(document.fullscreenElement===panel)document.exitFullscreen();else if(panel.requestFullscreen)panel.requestFullscreen();else panel.classList.toggle('chart-expanded')}apply()});document.addEventListener('fullscreenchange',()=>{const button=panel.querySelector('[data-chart-action="fullscreen"]');button.textContent=document.fullscreenElement===panel?'退出全屏':'全屏'});apply()})};window.initChartResizeControls(document)})();</script></body></html>
